# Warden — the commit/push gate for click-cms.
#
# Pre-commit checks PHP syntax and offline security patterns. Pre-push adds
# both test suites and the full online Nox scan in a disposable worktree.
# CI independently checks these and also exercises minimum PHP and containers.
agent: auto
hooks:
  pre_commit: true
  pre_push: true
commands:
  # A quick syntax check over the source and plugins — catches a broken file
  # before it is ever committed, in well under a second.
  lint: "composer lint"
  security-fast: "python3 scripts/security/nox_check.py --offline"
  security-scan: "python3 scripts/security/nox_check.py"
  test-security-gate: "python3 -m unittest discover -s scripts/security -p 'test_*.py'"
  # The PHP suite. The disposable worktree has composer.json/lock but no
  # vendor/ (gitignored, and warden auto-exposes only node_modules), so install
  # first — composer's global cache makes the repeat install fast, and phpunit is
  # the only dependency.
  test-php: "composer install --no-interaction --no-progress --quiet && php vendor/bin/phpunit --no-progress"
  # Install from the lock file so a clean worktree also gets the tested versions.
  test-admin: "cd admin-ui && npm ci --no-audit --no-fund && npm test"
steps:
  # Fast enough to run on every commit.
  pre_commit: [lint, security-fast]
  # The thorough gate before code leaves the machine: rebase clean, then lint and
  # both suites, mirroring .github/workflows/ci.yml.
  pre_push: [rebase, lint, test-php, test-admin, test-security-gate, security-scan]
risk:
  diff_lines_high: 400
  files_touched_high: 15
