# Two wired services: click-cms as the headless content backend, and the
# TurboScience website as a separate front end that reads the delivery API.
#
#   docker compose -f docker-compose.turboscience.yml up -d --build
#   ./demo/seed.sh          # log in, create the real content, go headless
#
# Then open:
#   http://localhost:3000   → the TurboScience site (content pulled from the CMS)
#   http://localhost:8080/admin → the Click CMS admin, where the content lives

services:
  # The content backend. Serves the admin UI and the delivery API; its own public
  # rendering is turned off (headless) by the seed step, because the front end
  # below renders the site instead.
  cms:
    build:
      context: .
    image: click-cms:turbo-demo
    container_name: turbo-cms
    volumes:
      # Real content and runtime state live on the host, so what the front end
      # reads is exactly what an editor saved in the admin.
      - ./demo/state/content:/var/www/html/content
      - ./demo/state/data:/var/www/html/data
    ports:
      - "8080:80"      # admin UI + delivery API (also used by the seed script)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health.php') !== false ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      start_period: 8s
      retries: 3

  # The TurboScience website. Its own brand, its own components; it renders the
  # CMS's sections and blog entries, fetched through nginx which proxies /api to
  # the cms service above.
  web:
    build:
      context: ./demo/turboscience-web
    image: turboscience-web:demo
    container_name: turbo-web
    ports:
      - "3000:80"
    depends_on:
      cms:
        condition: service_healthy
    restart: unless-stopped
