version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      composer-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directories:
      - /
      - /admin-ui
      - /scripts/screenshots
      - /sdk/typescript
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep the build on the maintained LTS line. Review a new Node major when
    # it enters LTS rather than following the Current release automatically.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
