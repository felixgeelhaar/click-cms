# The one thing that publishes to GitHub Pages.
#
# ## Why there is exactly one of these
#
# `actions/deploy-pages` replaces the *entire* site every time it runs. Pages
# already served the signed update feed, so adding a second workflow to publish
# documentation would not have added pages to a site — it would have deleted
# `feed.json`, and every installation checking for updates would have started
# reporting a feed error. Nothing in either workflow would have looked wrong.
#
# So the rule is: whatever deploys must assemble the *whole* site. That is this
# file, and nothing else calls `deploy-pages`.
#
# ## What the site is
#
#   /                  the documentation, built from README.md and docs/*.md
#   /feed.json         the signed update feed
#   /feed.json.sig     its detached signature
#
# ## When it runs
#
#   push to main   documentation changed
#   schedule       weekly, because the feed carries a 30-day expiry and has to be
#                  re-signed more often than it expires — see below
#   dispatch       the release workflow dispatches this after attaching packages
#   dispatch       by hand
#
# ## The weekly run is load-bearing, not housekeeping
#
# The feed carries an expiry so an attacker cannot serve a stale-but-signed copy
# forever and keep a site from hearing about a security release. The cost of that
# defence is that the feed goes stale on its own: a project that publishes twice
# a year and signs a 30-day feed would have every installation reporting a feed
# error for ten months — and, worse, treating a real outage as normal. Weekly
# against a 30-day TTL leaves three missed runs of margin before any site
# notices. This mirrors the timestamp role in The Update Framework, which exists
# for exactly this reason: something short-lived vouches that the long-lived
# thing is still current.

name: Publish site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'scripts/docs/**'
      - 'admin-ui/src/styles/editorial.css'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '23 4 * * 1'   # Mondays, 04:23 UTC — off the hour, so not in the stampede
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Every Pages deploy queues here, including independent runs dispatched
  # by the release workflow.
  #
  # This has to hold, and for a while it did not: the release workflow declared
  # its own separate group, so the two never serialised. A release and a docs
  # push deployed at the same time, the earlier one landed last, and its feed —
  # built one minute before the tag existed, and so offering no releases at all —
  # replaced the correct one. The site was not broken and nothing failed; it just
  # silently advertised no upgrade.
  #
  # Not cancelled in progress: a cancelled deploy leaves the site as whatever the
  # last complete one wrote, which is the same failure by another route.
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Reject release-context publication
        env:
          PUBLISH_EVENT: ${{ github.event_name }}
        run: |
          case "$PUBLISH_EVENT" in
            push|schedule|workflow_dispatch) ;;
            *) echo "::error::Pages must run independently of release events (issue 26)."; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none

      # ------------------------------------------------------------ docs --

      - name: Build the documentation
        run: php scripts/docs/build-site.php _site

      # ------------------------------------------------------------ feed --
      #
      # The feed is rebuilt from the published GitHub Releases every time rather
      # than carried forward, which is what lets a documentation push publish a
      # correct feed without knowing anything about releases.

      - name: Assemble the release list from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `gh release list --json` cannot return a release body — the field
          # does not exist on that command, and asking for it is a hard error.
          # This went unnoticed because the only thing that ever ran it was a
          # workflow nobody had triggered yet. The REST endpoint does return
          # `body`, which is where the [security] marker lives, and without it
          # no release could ever be flagged as a security release.
          #
          # Fetched whole and filtered once rather than with --paginate --jq,
          # which applies the filter per page and would emit several arrays.
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases-api.json

          # `notes` is the one line an installation is shown next to an offered
          # update, so it has to read as a sentence on its own.
          #
          # It used to be the body's first line, which was wrong twice over: a
          # body that opens with a blank line or a `###` heading yielded an
          # empty string — 3 of 19 releases, including two of the last three —
          # and a body that did open with prose yielded that prose *hard-wrapped
          # at 80 columns*, so the note ended mid-sentence, often on an em dash,
          # with raw markdown still in it.
          #
          # The release title is the reliable source: always present, written as
          # a one-line summary, and not wrapped. Strip the `v1.8.0 — ` prefix and
          # what remains is the summary. The body's first non-blank line stays as
          # a fallback for a release titled with nothing but its tag.
          jq '[ .[] | select(.draft | not) | . as $release | {
                version: (.tag_name | ltrimstr("v")),
                packageUrl: ("https://github.com/${{ github.repository }}/releases/download/" + .tag_name + "/click-cms-" + (.tag_name | ltrimstr("v")) + ".zip"),
                security: (.body // "" | test("\\[security\\]"; "i")),
                notes: (
                  ((.name // "") | sub("^v[0-9]+\\.[0-9]+\\.[0-9]+\\s*[—–-]\\s*"; "")) as $title
                  | if ($title | length) > 0 then $title
                    else ((.body // "") | split("\n") | map(select(test("\\S"))) | (.[0] // "")) end
                ),
                packagePublished: any(.assets[]?; .name == ("click-cms-" + ($release.tag_name | ltrimstr("v")) + ".zip")),
                requiresPhp: "8.1"
              } ]' releases-api.json > releases-raw.json

          echo "$(jq 'length' releases-raw.json) published release(s) before checksum filtering"

      - name: Add each package's checksum
        run: |
          # PHP variables must remain literal for the PHP interpreter.
          # shellcheck disable=SC2016
          php -r '
            $rows = json_decode(file_get_contents("releases-raw.json"), true) ?: [];
            $out = [];
            foreach ($rows as $row) {
              $tmp = tempnam(sys_get_temp_dir(), "pkg");
              $downloaded = false;
              for ($attempt = 0; $attempt < 4; $attempt++) {
                if (@copy($row["packageUrl"], $tmp) && filesize($tmp) > 0) {
                  $downloaded = true;
                  break;
                }
                if (!$row["packagePublished"]) break;
                if ($attempt < 3) sleep(5);
              }
              if (!$downloaded && $row["packagePublished"]) {
                fwrite(STDERR, "Published package could not be downloaded: " . $row["version"] . "\n");
                @unlink($tmp);
                exit(1);
              }
              if ($downloaded) {
                unset($row["packagePublished"]);
                $row["sha256"] = hash_file("sha256", $tmp);
                $out[] = $row;
              }
              @unlink($tmp);
            }
            file_put_contents("releases.json", json_encode($out, JSON_PRETTY_PRINT));
            fwrite(STDERR, count($out) . " release(s) in the feed\n");
          '

      - name: Sign the feed
        id: feed
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -n "${UPDATE_PRIVATE_KEY:-}" ]; then
            # The sequence must be monotonic ACROSS every run, so it cannot be
            # github.run_number: a per-workflow counter would let one run publish
            # a lower sequence than another and send the feed backwards — which
            # every site then refuses, turning the rollback defence into a
            # self-inflicted outage. Seconds since the epoch is shared, always
            # increasing, and never resets.
            printf '%s' "$UPDATE_PRIVATE_KEY" > /tmp/update-key.pem
            php scripts/updates/build-feed.php releases.json /tmp/update-key.pem _site \
              --sequence="$(date +%s)" --ttl-days=30
            rm -f /tmp/update-key.pem
            echo "signed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "signed=false" >> "$GITHUB_OUTPUT"

          # No signing key. That is expected exactly once — before the key has
          # been generated — and is an error at every other moment, so it is not
          # simply shrugged off: whatever feed is already published is carried
          # forward so that deploying documentation cannot take update delivery
          # down as a side effect.
          # Derived from github.repository, which is always "owner/repo" on
          # every trigger. github.event.repository is not populated on a
          # scheduled run, and the deploy step's own URL output does not exist
          # yet — it is produced by the step that has not run.
          base="https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}"

          carried=0
          for name in feed.json feed.json.sig; do
            # The status is captured separately from curl's own exit code so a
            # connection failure cannot be mistaken for an HTTP answer. Only an
            # explicit 404 is treated as "there is nothing there"; everything
            # else, including not reaching the server at all, is treated as "we
            # do not know", and not knowing is not grounds for replacing a live
            # site.
            code=$(curl -sS --max-time 30 -o "_site/$name.tmp" -w '%{http_code}' "$base/$name") || code="unreachable"
            case "$code" in
              200)
                mv "_site/$name.tmp" "_site/$name"
                carried=$((carried + 1))
                ;;
              404)
                # Nothing published yet, so there is nothing to preserve and
                # nothing to break. This is the first-run case.
                rm -f "_site/$name.tmp"
                ;;
              *)
                # Anything else — a network fault, a 5xx — is NOT proof the feed
                # is absent. Deploying now would delete a feed that exists.
                rm -f "_site/$name.tmp"
                echo "::error::Could not read $base/$name (HTTP $code). Refusing to deploy, because publishing without it could delete a live update feed." >&2
                exit 1
                ;;
            esac
          done

          if [ "$carried" -eq 0 ]; then
            echo "::warning::No signing key and no published feed — deploying documentation only. Set UPDATE_PRIVATE_KEY to publish an update feed."
          else
            echo "::warning::No signing key; carried the existing feed forward unchanged. It will expire unless UPDATE_PRIVATE_KEY is set."
          fi

      # Carrying the feed forward unsigned is a safety net for a documentation
      # push, not an acceptable outcome for the two events whose whole purpose is
      # the feed. A scheduled run exists *only* to refresh the signature, and a
      # release exists to be findable — either reporting green without signing
      # would be the silent failure this project keeps having to remove.
      #
      # `github.event_name` is the *caller's* event in a called workflow, so this
      # covers the release path too, which is why it is not just == 'schedule'.
      - name: Signing was required for this run
        if: >-
          steps.feed.outputs.signed != 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'release')
        run: |
          echo "::error::UPDATE_PRIVATE_KEY is not set, so the feed was not signed. A ${{ github.event_name }} run must sign: otherwise the published feed expires and every installation reports an update error." >&2
          exit 1

      # ---------------------------------------------------------- deploy --

      - name: Check the site is whole before deploying
        run: |
          set -eu
          test -f _site/index.html || { echo "::error::No index.html was built." >&2; exit 1; }
          # Jekyll would otherwise process the output and drop anything starting
          # with an underscore.
          touch _site/.nojekyll
          echo "Publishing $(find _site -type f | wc -l) files."

      # Keep Pages actions current together. Issue #26 remains guarded by the
      # dispatch path and complete live-artifact verification below.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

      # A successful deploy response is not proof that the new artifact is live.
      # Check every public file (Pages consumes .nojekyll), including docs and feed
      # files. No retry deployment hides a failed verification.
      - name: Verify every published site file
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/docs/verify-site.py _site "$PAGE_URL" --timeout 600
