name: Build Marketplace Registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'

      - name: Build registry with a temporary signing key
        env:
          MARKETPLACE_PRIVATE_KEY: ${{ secrets.MARKETPLACE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$MARKETPLACE_PRIVATE_KEY" ]; then
            echo "MARKETPLACE_PRIVATE_KEY secret is missing" >&2
            exit 1
          fi
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s' "$MARKETPLACE_PRIVATE_KEY" > "$key"
          php scripts/marketplace/build-registry-from-manifests.php marketplace/manifests "$key" marketplace/registry.json

      - name: Upload registry artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: marketplace-registry
          path: marketplace/registry.json
