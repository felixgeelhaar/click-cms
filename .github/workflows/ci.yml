# Runs every test suite the project has on every push and pull request, so a
# released project cannot regress in silence. Three independent jobs — they share
# no state and fail in isolation, so a red PHP suite still tells you whether the
# admin suite and the container are healthy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run already in flight —
# nobody waits on results for code that has been superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Matches the runtime image (Dockerfile: php:8.5-apache), so the suite runs
      # on the version production actually serves. gd/zip/pdo_sqlite are the
      # extensions the application loads at boot.
      #
      # Keep this, the Dockerfile and the phpunit constraint moving together.
      # They came apart once: phpunit was raised to ^13, which needs 8.4.1,
      # while this job ran 8.3 — `composer install` failed outright, so the
      # suite never ran here at all, and it stayed red for two days and through
      # a release because it passed for anyone whose local PHP was newer.
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: gd, zip, pdo_sqlite
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run test suite
        run: vendor/bin/phpunit --no-progress

      - name: Verify isolated backup restoration
        run: php scripts/security/restore-drill.php

      # The documentation site is generated at deploy time, so a generator that
      # stopped working would be discovered by GitHub Pages rather than by CI —
      # and the run that discovers it is the one that publishes the update feed.
      # Building it here means a broken generator fails the pull request instead.
      - name: Build the documentation site
        run: |
          php scripts/docs/build-site.php /tmp/docs-site
          test -f /tmp/docs-site/index.html
          echo "built $(find /tmp/docs-site -type f | wc -l) files"

  minimum-php:
    name: Minimum supported PHP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # composer.json says `php: >=8.1`, the README badge says 8.1+, and every
      # entry in the signed update feed advertises `requiresPhp: "8.1"` — which
      # is what an installation checks before it will take an upgrade. Nothing
      # tested any of that. The suite runs on the latest PHP, so a feature used
      # in `src/` that 8.1 cannot parse would have shipped, and the first person
      # to find out would have been someone on 8.1 whose site stopped booting.
      #
      # The test suite deliberately does not run here: phpunit needs a far newer
      # PHP than the floor, and pinning the whole project's tooling to the
      # oldest version it supports is the wrong trade. What matters is the
      # promise itself — that the shipped code parses and the application boots
      # and serves a page.
      - name: Set up the oldest PHP the project claims to support
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
          extensions: gd, zip, pdo_sqlite
          coverage: none

      - name: Every shipped file parses
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || { echo "does not parse on 8.1: $f"; fail=1; }
          done < <(find src plugins bin public -name '*.php' -print0)
          exit $fail

      # Parsing is not booting. This seeds a site and asks for a real page,
      # because a runtime call to a function added after 8.1 parses perfectly
      # and fails on the request.
      - name: The application boots and serves a page
        run: |
          composer dump-autoload --no-interaction
          php bin/click-seed.php
          php -S 127.0.0.1:9111 -t public &
          for _ in $(seq 1 20); do
            sleep 1
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9111/ || true)"
            [ "$code" = "200" ] && break
          done
          body="$(curl -fsS http://127.0.0.1:9111/)"
          printf '%s' "$body" | grep -q '<h1' || { echo "no page rendered:"; printf '%s' "$body" | head -c 400; exit 1; }
          echo "8.1 serves a rendered page."

  admin:
    name: Admin UI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 22 matches the admin-ui build stage in the Dockerfile.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Building the image proves the multi-stage build still assembles: Composer
      # deps, the admin UI build, the extension check, and the file layout. The
      # build itself fails if any of those break.
      - name: Build image
        run: docker build -t click-cms:ci .

      # Then prove the built image actually serves. The health endpoint boots
      # nothing but confirms PHP runs and the writable paths exist — the failure
      # that matters in a container.
      - name: Run container
        run: docker run -d --name click-cms-ci -p 8080:80 click-cms:ci

      - name: Wait for health
        run: |
          for _ in $(seq 1 30); do
            body="$(curl -fsS http://127.0.0.1:8080/health.php || true)"
            echo "$body"
            if printf '%s' "$body" | grep -q '"status":"ok"'; then
              echo "Container healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy in time." >&2
          docker logs click-cms-ci >&2
          exit 1

      - name: Build hardened image
        run: docker build --target hardened -t click-cms:hardened-ci .

      - name: Run hardened container
        run: >-
          docker run -d --name click-cms-hardened-ci -p 8081:8080
          --read-only --cap-drop ALL --security-opt no-new-privileges:true
          --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777
          --tmpfs /var/run/apache2:rw,noexec,nosuid,size=1m,uid=33,gid=33
          --tmpfs /var/lock/apache2:rw,noexec,nosuid,size=1m,uid=33,gid=33
          --mount type=volume,destination=/var/www/html/content
          --mount type=volume,destination=/var/www/html/data
          click-cms:hardened-ci

      - name: Verify hardened runtime
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/health.php | grep -q '"status":"ok"'; then
              docker exec click-cms-hardened-ci php -r '
                if (posix_geteuid() === 0) { exit(1); }
                if (getenv("CLICK_DEPLOYMENT_MANAGED") !== "1") { exit(2); }
                if (@file_put_contents("/var/www/html/src/write-probe", "x") !== false) { exit(3); }
                if (file_put_contents("/var/www/html/data/write-probe", "x") !== 1) { exit(4); }
                unlink("/var/www/html/data/write-probe");
              '
              exit 0
            fi
            sleep 2
          done
          docker logs click-cms-hardened-ci >&2
          exit 1

      - name: Stop containers
        if: always()
        run: docker rm -fv click-cms-ci click-cms-hardened-ci || true

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: gd, zip, pdo_sqlite
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin-ui/package-lock.json

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build admin UI into public/admin
        working-directory: admin-ui
        run: |
          npm ci
          npm run build
          mkdir -p ../public/admin
          cp -r dist/* ../public/admin/

      - name: Seed example site
        run: php bin/click-seed.php

      # Boot creates admin/admin with mustChangePassword; pin a known password
      # so the smoke can sign in without depending only on the forced-change UI.
      - name: Reset admin password for e2e
        env:
          CLICK_E2E_PASS: admin-demo-pass-99
        run: |
          # PHP variables must remain literal for PHP.
          # shellcheck disable=SC2016
          php -r '
            $path = "content/user/en/admin.json";
            $doc = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
            $pass = getenv("CLICK_E2E_PASS") ?: "admin-demo-pass-99";
            $doc["data"]["password"] = password_hash($pass, PASSWORD_DEFAULT);
            $doc["data"]["mustChangePassword"] = false;
            $doc["data"]["passwordChangedAt"] = gmdate("c");
            $doc["updatedAt"] = gmdate("c");
            file_put_contents($path, json_encode($doc, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
            echo "admin password reset for e2e\n";
          '

      - name: Start PHP built-in server
        run: |
          php -S 127.0.0.1:8080 -t public > /tmp/click-e2e-php.log 2>&1 &
          echo $! > /tmp/click-e2e-php.pid
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/ || { echo "server failed:"; cat /tmp/click-e2e-php.log; exit 1; }

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e smoke
        env:
          CLICK_E2E: '1'
          CLICK_E2E_BASE_URL: http://127.0.0.1:8080
          CLICK_E2E_PASS: admin-demo-pass-99
          CLICK_E2E_NO_CHANNEL: '1'
        run: npm run test:e2e

      - name: Stop PHP server
        if: always()
        run: |
          if [ -f /tmp/click-e2e-php.pid ]; then
            kill "$(cat /tmp/click-e2e-php.pid)" || true
          fi
