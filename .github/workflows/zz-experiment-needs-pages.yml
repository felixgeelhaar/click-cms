# TEMPORARY — second experiment for issue #26, to be deleted once it has answered.
#
# ## The confound this closes
#
# The evidence says release-triggered deploys fail 3/3 and everything else lands
# 7/7. But every failing run was `release.yml`, where the Pages job carries
# `needs: package` and a prior job has already run. Every success — including the
# `workflow_call` experiment — was a run whose Pages job was the *first* job.
#
# So two explanations still fit every data point:
#
#   A. the `release` event
#   B. a Pages deploy in a run where another job ran first
#
# They imply completely different fixes. If it is (A), `release.yml` must
# dispatch `pages.yml` instead of calling it, which needs a token that can
# trigger workflows — a standing PAT or GitHub App, a real security cost. If it
# is (B), `release.yml` just needs restructuring so the deploy is not downstream
# of another job, and costs nothing.
#
# Recommending the expensive fix without ruling out the cheap one would be
# careless, and this is free to check.
#
# ## The design
#
# Identical to the experiment that passed at 14:26 — dispatch-triggered, calling
# `pages.yml` — with exactly one thing added: a trivial job in front of it, and
# `needs:` pointing at it. That is the only variable.
#
#   passes → (B) is dead; the release event is implicated, and the fix is dispatch
#   fails  → (B) is the cause; flatten release.yml, no credential needed
#
# ## Safety
#
# The feed it builds is equivalent to the published one, differing only in
# sequence and expiry, so neither outcome leaves the site worse off. A failure
# leaves the current feed in place.

name: zz experiment — pages behind a needs (issue #26)

on:
  workflow_dispatch:

# Must match what the callee asks for; a called workflow's permissions have to be
# a subset of its caller's. Omitting this is what made the first experiment fail
# at startup with zero jobs.
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Stands in for release.yml's `package` job. Its only purpose is to exist and
  # finish, so the Pages job is not the first job in the run.
  before:
    name: A job that runs first
    runs-on: ubuntu-latest
    steps:
      - run: echo "Occupying the same position release.yml's package job does."

  call-pages:
    name: Call pages.yml downstream of another job
    needs: before
    uses: ./.github/workflows/pages.yml
    secrets: inherit
