name: Security audit

on:
  push:
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nox:
    name: Nox security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the report completeness gate
        run: python3 -m unittest discover -s scripts/security -p 'test_*.py'

      - name: Scan source, secrets, dependencies and infrastructure
        id: nox
        uses: Nox-HQ/nox@0b56bd883d8db126a4711ae9a5c1eb5c8ac45c4b # v1.54.0
        with:
          version: '1.54.0'
          format: json,sarif
          output: .nox/reports/full
          fail-on-findings: 'true'
          annotate: 'false'
          pr-comment: 'false'

      # Missing/malformed reports and failed checks block the job. Advisory
      # notices about globally installed, unselected plugins stay visible.
      - name: Require a complete scan report
        if: always()
        run: python3 scripts/security/nox_check.py --report .nox/reports/full/findings.json

      - name: Retain Nox reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nox-security-reports
          path: .nox/reports/full/
          if-no-files-found: error
          retention-days: 14

  composer-audit:
    name: Composer dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none

      # Audits the lock file, including require-dev packages. Composer has no
      # runtime packages today, but its test tooling is still part of the
      # repository's dependency surface and should remain visible in the report.
      - name: Audit locked Composer dependencies
        run: composer audit --locked --no-interaction

  admin-npm-audit:
    name: npm dependency audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [".", "admin-ui", "scripts/screenshots", "sdk/typescript"]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      # npm audit reads the lockfile and includes production and development
      # dependencies by default. No install or automatic remediation is run.
      - name: Audit locked npm dependencies
        run: npm audit --package-lock-only
