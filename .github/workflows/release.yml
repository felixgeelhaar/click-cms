# Builds the update package for a published release, then republishes the signed
# feed so existing installations can find it.
#
# Triggered by publishing a GitHub Release. The tag is the version, so tagging
# v1.2.0 and publishing produces click-cms-1.2.0.zip and a feed offering it.
#
# Secrets:
#   UPDATE_PRIVATE_KEY    the PEM private key the feed is signed with
#                         (the matching public key goes in each site's
#                         core.updates.publicKey)
#   PAGES_DISPATCH_TOKEN  a token that may start workflow runs, used to dispatch
#                         pages.yml. GITHUB_TOKEN deliberately cannot, and a
#                         Pages deploy made from inside a release run is never
#                         served — see issue #26 and the job below. Without it
#                         the release still publishes, but the feed does not
#                         update and the run says so loudly.
#
# Mark a release as a security release by putting "[security]" anywhere in its
# body: sites on the default policy install those unattended, and only those.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # attach the package to the release
  pages: write      # publish the feed
  id-token: write

# Deliberately no workflow-level concurrency.
#
# The Pages deploy is serialised by the `pages` group declared in pages.yml.
# That holds whether this workflow calls it or dispatches it: a called workflow's
# own concurrency applies to it, and a dispatched run is an ordinary run of
# pages.yml. Declaring `pages` here as well would have this run hold the group
# while waiting for the pages run to acquire it, which is a deadlock — and that
# is now true of the dispatch path too, where this job waits on a separate run.
#
# This previously said `release-feed` while pages.yml said `pages`, so the two
# groups never matched and nothing serialised anything. A documentation push and
# a release deployed concurrently, the earlier one finished last, and a feed
# built before the tag existed — offering zero releases — overwrote the correct
# one. Whatever deploys last wins, so what matters is that deploys queue.

jobs:
  package:
    name: Build and attach the release package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      security: ${{ steps.meta.outputs.security }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: gd, zip, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Work out what this release is
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A security release is flagged in the release body; the update policy
          # reads this to decide what may install itself unattended.
          if printf '%s' "${{ github.event.release.body }}" | grep -qi '\[security\]'; then
            echo "security=true" >> "$GITHUB_OUTPUT"
          else
            echo "security=false" >> "$GITHUB_OUTPUT"
          fi

      # A tag and a constant that disagree produce an installation that cannot
      # tell what it is running — which is how 1.3.0 stayed in the code through
      # four releases. Cheaper to refuse here than to ship it.
      - name: The code must agree with the tag
        run: |
          version="${{ steps.meta.outputs.version }}"
          declared=$(grep -oE "const VERSION = '[^']+'" src/Core/Application.php | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          if [ "$version" != "$declared" ]; then
            echo "::error::tag v${version} but Application::VERSION is ${declared}"
            exit 1
          fi
          echo "tag and Application::VERSION agree: ${version}"

      - name: Install runtime dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Build the admin UI
        run: |
          cd admin-ui
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p ../public/admin
          cp -r dist/* ../public/admin/

      - name: Pack
        id: pack
        run: |
          version="${{ steps.meta.outputs.version }}"
          stage="click-cms-$version"
          mkdir -p "$stage"
          # Only what a release replaces. content/, data/ and config/ are the
          # site's own — the installer refuses to write them anyway, and shipping
          # them would invite someone to try.
          for dir in src public plugins vendor bin themes; do
            [ -d "$dir" ] && cp -r "$dir" "$stage/"
          done
          # Not `|| true`: that swallowed a missing LICENSE for every release
          # ever cut, so each archive shipped with no licence at all while the
          # README claimed MIT. A package nobody may legally use should fail to
          # build, not build quietly.
          cp composer.json LICENSE "$stage/"
          zip -qr "$stage.zip" "$stage"
          echo "sha256=$(sha256sum "$stage.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # A second archive, for installing rather than upgrading.
      #
      # The package above is what the updater unpacks over an existing site, so
      # it deliberately omits config/ — the installer refuses to overwrite a
      # site's own settings. That makes it useless to someone who has no site
      # yet: unzip it and the first boot fails on a missing config/core.json.
      #
      # Shared hosting is the audience that most needs a download and least
      # wants to run composer, so it gets an archive that actually starts:
      # everything in the update package, plus the default configuration and the
      # empty content and data directories the site will fill.
      - name: Pack the install archive
        run: |
          version="${{ steps.meta.outputs.version }}"
          stage="click-cms-$version"
          install="click-cms-$version-install"
          cp -r "$stage" "$install"
          cp -r config "$install/"
          mkdir -p "$install/content" "$install/data"
          zip -qr "$install.zip" "$install"

      - name: Attach the packages to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            click-cms-${{ steps.meta.outputs.version }}.zip
            click-cms-${{ steps.meta.outputs.version }}-install.zip

  # ------------------------------------------------------------------------
  # Publishing the feed, and why this is not simply `uses: ./…/pages.yml`
  #
  # It was, and it did not work. A Pages deployment created under a `release`
  # event is accepted, reports success, and is never served: 0 of 3 landed,
  # against 8 of 8 from every other trigger. Issue #26 has the runs, and the
  # alternatives — the call mechanism, the job structure, deploy proximity, the
  # commit SHA, concurrency, CDN caching, a malformed build — were each ruled
  # out by experiment rather than argument.
  #
  # A dispatched run lands. So the release *dispatches* `pages.yml` instead of
  # calling it, then waits for it and fails with it.
  #
  # The waiting is the part that matters. Firing and forgetting would restore
  # exactly the failure this whole thread removed: a green release over a feed
  # nobody is serving, discovered days later by somebody wondering why an
  # update never arrived.
  # ------------------------------------------------------------------------

  # Whether a token capable of dispatching is configured. `GITHUB_TOKEN`
  # deliberately cannot start further workflow runs, so this needs one of its
  # own — see docs/updates.md.
  #
  # A secret cannot be read in a job-level `if`, so it is turned into an output
  # here and the two paths below gate on that.
  decide:
    name: Decide how to publish the feed
    needs: package
    runs-on: ubuntu-latest
    outputs:
      dispatch: ${{ steps.check.outputs.dispatch }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
        run: |
          if [ -n "${TOKEN:-}" ]; then
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PAGES_DISPATCH_TOKEN is not set, so the feed is published from inside this run — the path that does not take effect on a release. Expect the deploy to fail its own verification; republish with: gh workflow run pages.yml --ref main. See docs/updates.md."
          fi

  publish-by-dispatch:
    name: Publish the site and feed
    needs: [package, decide]
    if: needs.decide.outputs.dispatch == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the site workflow and wait for it
        env:
          # The dispatching token, not GITHUB_TOKEN. `gh` reads GH_TOKEN.
          GH_TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          # The default branch, deliberately, and not GITHUB_REF_NAME — on a
          # release event that is the *tag*. Dispatching on a tag would build
          # the site from whatever that tag points at, so a release cut from an
          # older commit would republish that commit's documentation over the
          # current site. The feed is assembled from the GitHub API and is the
          # same either way; the docs are not.
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Recorded before dispatching, and to the second, because the run is
          # identified by being newer than this. A clock read after the dispatch
          # could miss a run that started immediately.
          since=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
                  || date -u -v-1M +%Y-%m-%dT%H:%M:%SZ)

          echo "Dispatching pages.yml on ${BRANCH}…"
          gh workflow run pages.yml --repo "$REPO" --ref "$BRANCH"

          # `gh workflow run` does not report the run it started, so it has to be
          # found. Narrowed to dispatch-triggered runs of this workflow created
          # since the timestamp above; the newest such run is ours.
          #
          # Two dispatches racing would be ambiguous. That is accepted: the only
          # other dispatcher is a person, and the alternative — inventing a
          # correlation id and threading it through an input — buys certainty
          # against a case that does not happen during a release.
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --repo "$REPO" --workflow=pages.yml \
                       --event=workflow_dispatch --created ">=${since}" \
                       --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "::error::Dispatched pages.yml but no run appeared within 150s. The release is published and its packages are downloadable, but the feed has not been rebuilt, so no installation will be offered it. Publish it with: gh workflow run pages.yml --ref ${BRANCH}" >&2
            exit 1
          fi

          url="https://github.com/${REPO}/actions/runs/${run_id}"
          echo "Waiting on ${url}"

          # `gh run watch --exit-status` returns the run's own conclusion, so a
          # failed deploy — including one that fails the feed verification —
          # fails this job and therefore the release.
          gh run watch "$run_id" --repo "$REPO" --exit-status --interval 15 || {
            echo "::error::The site workflow failed: ${url}. The release is published and its packages are downloadable, but until that run succeeds the feed does not list this release and no installation will be offered it." >&2
            exit 1
          }

          echo "Feed published by ${url}"

  # The old path, kept only for an installation with no dispatching token — a
  # fork, or this repository before the secret is added. It is known not to take
  # effect on a release, and `pages.yml`'s own verification step fails loudly
  # when it does not, so this degrades noisily rather than silently. That is the
  # whole reason it is still here instead of being an error.
  publish-in-run:
    name: Publish the site and feed (no dispatch token)
    needs: [package, decide]
    if: needs.decide.outputs.dispatch == 'false'
    uses: ./.github/workflows/pages.yml
    # The called workflow declares its own permissions; secrets have to be
    # passed down explicitly or UPDATE_PRIVATE_KEY is not visible to it.
    secrets: inherit
