# Builds the update package for a published release, then republishes the signed
# feed so existing installations can find it.
#
# Triggered by publishing a GitHub Release. The tag is the version, so tagging
# v1.2.0 and publishing produces click-cms-1.2.0.zip and a feed offering it.
#
# Two secrets are required:
#   UPDATE_PRIVATE_KEY  the PEM private key the feed is signed with
#   (the matching public key goes in each site's core.storage… core.updates.publicKey)
#
# Mark a release as a security release by putting "[security]" anywhere in its
# body: sites on the default policy install those unattended, and only those.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # attach the package to the release
  pages: write      # publish the feed
  id-token: write

concurrency:
  group: release-feed
  cancel-in-progress: false   # never race two feed publishes

jobs:
  package:
    name: Build and attach the release package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      security: ${{ steps.meta.outputs.security }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, zip, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Work out what this release is
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A security release is flagged in the release body; the update policy
          # reads this to decide what may install itself unattended.
          if printf '%s' "${{ github.event.release.body }}" | grep -qi '\[security\]'; then
            echo "security=true" >> "$GITHUB_OUTPUT"
          else
            echo "security=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install runtime dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Build the admin UI
        run: |
          cd admin-ui
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p ../public/admin
          cp -r dist/* ../public/admin/

      - name: Pack
        id: pack
        run: |
          version="${{ steps.meta.outputs.version }}"
          stage="click-cms-$version"
          mkdir -p "$stage"
          # Only what a release replaces. content/, data/ and config/ are the
          # site's own — the installer refuses to write them anyway, and shipping
          # them would invite someone to try.
          for dir in src public plugins vendor bin themes; do
            [ -d "$dir" ] && cp -r "$dir" "$stage/"
          done
          # Not `|| true`: that swallowed a missing LICENSE for every release
          # ever cut, so each archive shipped with no licence at all while the
          # README claimed MIT. A package nobody may legally use should fail to
          # build, not build quietly.
          cp composer.json LICENSE "$stage/"
          zip -qr "$stage.zip" "$stage"
          echo "sha256=$(sha256sum "$stage.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # A second archive, for installing rather than upgrading.
      #
      # The package above is what the updater unpacks over an existing site, so
      # it deliberately omits config/ — the installer refuses to overwrite a
      # site's own settings. That makes it useless to someone who has no site
      # yet: unzip it and the first boot fails on a missing config/core.json.
      #
      # Shared hosting is the audience that most needs a download and least
      # wants to run composer, so it gets an archive that actually starts:
      # everything in the update package, plus the default configuration and the
      # empty content and data directories the site will fill.
      - name: Pack the install archive
        run: |
          version="${{ steps.meta.outputs.version }}"
          stage="click-cms-$version"
          install="click-cms-$version-install"
          cp -r "$stage" "$install"
          cp -r config "$install/"
          mkdir -p "$install/content" "$install/data"
          zip -qr "$install.zip" "$install"

      - name: Attach the packages to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            click-cms-${{ steps.meta.outputs.version }}.zip
            click-cms-${{ steps.meta.outputs.version }}-install.zip

  # The feed is published by the one workflow that owns GitHub Pages. It used to
  # be duplicated here, and that duplication is exactly what made adding a
  # documentation site dangerous: `deploy-pages` replaces the whole site, so
  # every publisher has to assemble all of it, and three publishers meant three
  # places to get that wrong. Now there is one, and this calls it.
  site:
    name: Publish the site and feed
    needs: package
    uses: ./.github/workflows/pages.yml
    # The called workflow declares its own permissions; secrets have to be
    # passed down explicitly or UPDATE_PRIVATE_KEY is not visible to it.
    secrets: inherit
