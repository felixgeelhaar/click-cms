# Builds the update package for a published release, then republishes the signed
# feed so existing installations can find it.
#
# Triggered by publishing a GitHub Release. The tag is the version, so tagging
# v1.2.0 and publishing produces click-cms-1.2.0.zip and a feed offering it.
#
# Two secrets are required:
#   UPDATE_PRIVATE_KEY  the PEM private key the feed is signed with
#   (the matching public key goes in each site's core.storage… core.updates.publicKey)
#
# Mark a release as a security release by putting "[security]" anywhere in its
# body: sites on the default policy install those unattended, and only those.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # attach the package to the release
  pages: write      # publish the feed
  id-token: write

concurrency:
  group: release-feed
  cancel-in-progress: false   # never race two feed publishes

jobs:
  package:
    name: Build and attach the release package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      security: ${{ steps.meta.outputs.security }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, zip, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Work out what this release is
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A security release is flagged in the release body; the update policy
          # reads this to decide what may install itself unattended.
          if printf '%s' "${{ github.event.release.body }}" | grep -qi '\[security\]'; then
            echo "security=true" >> "$GITHUB_OUTPUT"
          else
            echo "security=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install runtime dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Build the admin UI
        run: |
          cd admin-ui
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p ../public/admin
          cp -r dist/* ../public/admin/

      - name: Pack
        id: pack
        run: |
          version="${{ steps.meta.outputs.version }}"
          stage="click-cms-$version"
          mkdir -p "$stage"
          # Only what a release replaces. content/, data/ and config/ are the
          # site's own — the installer refuses to write them anyway, and shipping
          # them would invite someone to try.
          for dir in src public plugins vendor bin themes; do
            [ -d "$dir" ] && cp -r "$dir" "$stage/"
          done
          cp composer.json LICENSE "$stage/" 2>/dev/null || true
          zip -qr "$stage.zip" "$stage"
          echo "sha256=$(sha256sum "$stage.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Attach the package to the release
        uses: softprops/action-gh-release@v2
        with:
          files: click-cms-${{ steps.meta.outputs.version }}.zip

  feed:
    name: Publish the signed feed
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Assemble the release list from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The feed is rebuilt from the published releases each time rather than
          # accumulated in a file, so it cannot drift from what actually exists.
          gh release list --limit 100 --json tagName,isDraft,isPrerelease,body \
            --jq '[ .[] | select(.isDraft | not) | {
                  version: (.tagName | ltrimstr("v")),
                  packageUrl: ("https://github.com/${{ github.repository }}/releases/download/" + .tagName + "/click-cms-" + (.tagName | ltrimstr("v")) + ".zip"),
                  security: (.body // "" | test("\\[security\\]"; "i")),
                  notes: (.body // "" | split("\n")[0]),
                  requiresPhp: "8.1"
                } ]' > releases-raw.json

      - name: Add each package's checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A feed entry without the right sha256 is a release no site will
          # install, so the hashes are taken from the artefacts themselves.
          php -r '
            $rows = json_decode(file_get_contents("releases-raw.json"), true) ?: [];
            $out = [];
            foreach ($rows as $row) {
              $tmp = tempnam(sys_get_temp_dir(), "pkg");
              $ok = @copy($row["packageUrl"], $tmp);
              if ($ok && filesize($tmp) > 0) {
                $row["sha256"] = hash_file("sha256", $tmp);
                $out[] = $row;
              } else {
                fwrite(STDERR, "skipping {$row["version"]}: package not downloadable\n");
              }
              @unlink($tmp);
            }
            file_put_contents("releases.json", json_encode($out, JSON_PRETTY_PRINT));
            fwrite(STDERR, count($out) . " release(s) in the feed\n");
          '

      - name: Sign the feed
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATE_PRIVATE_KEY" ]; then
            echo "::error::UPDATE_PRIVATE_KEY is not set; the feed cannot be signed." >&2
            exit 1
          fi
          # The sequence must be monotonic ACROSS both workflows, so it cannot be
          # github.run_number: each workflow has its own counter, and the release
          # job (run 3) publishing after the re-sign job (run 20) would send the
          # feed backwards — which every site would then refuse, turning the
          # rollback defence into a self-inflicted outage. Seconds since the
          # epoch is shared, always increasing, and never resets.
          SEQUENCE=$(date +%s)
          printf '%s' "$UPDATE_PRIVATE_KEY" > /tmp/update-key.pem
          php scripts/updates/build-feed.php releases.json /tmp/update-key.pem _site \
            --sequence="$SEQUENCE" --ttl-days=30
          rm -f /tmp/update-key.pem

      - name: Publish to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
