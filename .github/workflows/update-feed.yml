# Re-signs the update feed on a schedule, without publishing anything new.
#
# This is not housekeeping — it is load-bearing. The feed carries an expiry so
# that an attacker cannot serve a stale-but-signed copy forever and keep a site
# from hearing about a security release. The cost of that defence is that the
# feed goes stale on its own: a project that publishes twice a year and signs a
# 30-day feed would have every installation reporting a feed error for ten
# months, and — worse — treating a real outage as normal.
#
# So a fresh signature has to be published more often than the feed expires.
# Weekly against a 30-day TTL leaves three missed runs of margin before any site
# notices.
#
# This mirrors the timestamp role in The Update Framework, which exists for
# exactly this reason: something short-lived has to vouch that the long-lived
# thing is still current.
name: Re-sign update feed

on:
  schedule:
    - cron: '23 4 * * 1'   # Mondays, 04:23 UTC — off the hour, so not in the stampede
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: release-feed      # the same group the release workflow uses: never two publishes at once
  cancel-in-progress: false

jobs:
  resign:
    name: Re-sign and republish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Assemble the release list from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,isDraft,isPrerelease,body \
            --jq '[ .[] | select(.isDraft | not) | {
                  version: (.tagName | ltrimstr("v")),
                  packageUrl: ("https://github.com/${{ github.repository }}/releases/download/" + .tagName + "/click-cms-" + (.tagName | ltrimstr("v")) + ".zip"),
                  security: (.body // "" | test("\\[security\\]"; "i")),
                  notes: (.body // "" | split("\n")[0]),
                  requiresPhp: "8.1"
                } ]' > releases-raw.json

      - name: Add each package's checksum
        run: |
          php -r '
            $rows = json_decode(file_get_contents("releases-raw.json"), true) ?: [];
            $out = [];
            foreach ($rows as $row) {
              $tmp = tempnam(sys_get_temp_dir(), "pkg");
              if (@copy($row["packageUrl"], $tmp) && filesize($tmp) > 0) {
                $row["sha256"] = hash_file("sha256", $tmp);
                $out[] = $row;
              }
              @unlink($tmp);
            }
            file_put_contents("releases.json", json_encode($out, JSON_PRETTY_PRINT));
            fwrite(STDERR, count($out) . " release(s) in the feed\n");
          '

      - name: Sign
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATE_PRIVATE_KEY" ]; then
            echo "::error::UPDATE_PRIVATE_KEY is not set; the feed would expire." >&2
            exit 1
          fi
          # The sequence must be monotonic ACROSS both workflows, so it cannot be
          # github.run_number: each workflow has its own counter, and the release
          # job (run 3) publishing after the re-sign job (run 20) would send the
          # feed backwards — which every site would then refuse, turning the
          # rollback defence into a self-inflicted outage. Seconds since the
          # epoch is shared, always increasing, and never resets.
          SEQUENCE=$(date +%s)
          printf '%s' "$UPDATE_PRIVATE_KEY" > /tmp/update-key.pem
          php scripts/updates/build-feed.php releases.json /tmp/update-key.pem _site \
            --sequence="$SEQUENCE" --ttl-days=30
          rm -f /tmp/update-key.pem

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
