# Serves the CMS from public/ so that src/, plugins/, content/ and vendor/ are
# never reachable over HTTP — the document root is the security boundary.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # No Indexes: a missing index file must not list the directory.
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # The admin UI is a client-routed single-page app: only /admin/index.html
    # exists on disk, so a deep link such as /admin/pages/new has to be served
    # that same document and let the app route it. Without this the request
    # falls through to PHP, which has no such route.
    <Directory /var/www/html/public/admin>
        RewriteEngine On
        RewriteBase /admin/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /admin/index.html [L]
    </Directory>

    # Themes live outside the document root on purpose: a site's design must
    # survive a deploy that replaces the application, which a file inside
    # public/ would not. They are aliased back in read-only.
    #
    # A theme is an installable package — someone else's files — so nothing in
    # it is ever executed. Denying the executable extensions here means a theme
    # carrying a stray .php cannot become a way to run code, which is the whole
    # risk of serving a directory a package can write to.
    Alias /themes /var/www/html/themes
    <Directory /var/www/html/themes>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted

        <FilesMatch "\.(php|phtml|phps|phar|cgi|pl|py|sh)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Belt and braces: even if the document root is ever misconfigured, refuse
    # to serve application internals.
    <DirectoryMatch "^/var/www/html/(src|plugins|vendor|content|data|tests)">
        Require all denied
    </DirectoryMatch>

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
