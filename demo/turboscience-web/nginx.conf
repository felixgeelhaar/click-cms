# The TurboScience front end. It serves the built SPA and forwards every /api
# request to the click-cms service over the compose network — so the browser
# only ever talks to one origin (no CORS), and the CMS host is never baked into
# the JavaScript bundle. This is the wiring that makes the two services one site.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Delivery API and media, proxied to the headless CMS. "cms" resolves to the
  # click-cms container by its compose service name.
  location /api/ {
    proxy_pass http://cms:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA routing: unknown paths fall back to index.html so /blog/:slug works on a
  # hard refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
